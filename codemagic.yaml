workflows:
  build-bpre-dmg:
    name: Build BPRE macOS DMG
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Install create-dmg
        script: |
          brew install create-dmg

      - name: Download App and Prepare Assets
        script: |
          # Paste your new Discord CDN link for BP-REBOOTED macOS edition by SoultheHopper.zip
          curl -f -L -o "BPRE_macOS.zip" "https://cdn.discordapp.com/attachments/1462108705410519162/1574078936198160384/BP-REBOOTED_macOS_edition_by_SoultheHopper.zip?ex=6b0456bf&is=6b03053f&hm=a9f336eca4235b9e034cecd44c09cf9fb4d8731375026b1a99dd56d804609aa5&"
          
          # Unzip your macOS app
          unzip -q "BPRE_macOS.zip" -d ./app_extracted
          
          # Locate the real .app while ignoring __MACOSX metadata folders
          APP_PATH=$(find ./app_extracted -path "*/__MACOSX" -prune -o -name "*.app" -maxdepth 2 -print | head -n 1)
          mkdir -p ./dmg_source
          cp -R "$APP_PATH" ./dmg_source/

          # Restore macOS executable permissions
          chmod +x ./dmg_source/*.app/Contents/MacOS/*

          # Convert "BPRE disk dmg.png" to icon.icns
          mkdir -p icon.iconset
          sips -z 16 16     "BPRE disk dmg.png" --out icon.iconset/icon_16x16.png
          sips -z 32 32     "BPRE disk dmg.png" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     "BPRE disk dmg.png" --out icon.iconset/icon_32x32.png
          sips -z 64 64     "BPRE disk dmg.png" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   "BPRE disk dmg.png" --out icon.iconset/icon_128x128.png
          sips -z 256 256   "BPRE disk dmg.png" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   "BPRE disk dmg.png" --out icon.iconset/icon_256x256.png
          sips -z 512 512   "BPRE disk dmg.png" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   "BPRE disk dmg.png" --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 "BPRE disk dmg.png" --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset

          # Keep exact 660x400 size and set 72 DPI metadata
          cp "Innovation_Background_IL2CPP_Recomp_Empty_Background.png" "bg_final.png"
          sips -s dpiWidth 72 -s dpiHeight 72 "bg_final.png"

      - name: Package BPRE.dmg
        script: |
          mkdir -p output
          APP_FULL_PATH=$(find ./dmg_source -name "*.app" -maxdepth 1 | head -n 1)
          APP_NAME=$(basename "$APP_FULL_PATH")

          # Wake Finder so AppleScript styling doesn't time out on CI
          open -a Finder
          sleep 2

          create-dmg \
            --volname "BP-REBOOTED" \
            --volicon "icon.icns" \
            --background "bg_final.png" \
            --window-pos 200 120 \
            --window-size 660 440 \
            --icon-size 100 \
            --icon "$APP_NAME" 180 225 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 480 225 \
            --no-internet-enable \
            "output/BP-REBOOTED.dmg" \
            "./dmg_source/"

    artifacts:
      - output/*.dmg
